const SQL_TEXT="-- =====================================================================\n--  RaevYoU \u00b7 Supabase schema  (\u0430\u043d\u043e\u043d\u0438\u043c\u043d\u044b\u0439 \u0447\u0430\u0442 + \u043e\u0442\u0437\u044b\u0432\u044b + \u0430\u0434\u043c\u0438\u043d\u044b)\n--  Supabase \u2192 SQL Editor \u2192 New query \u2192 \u0432\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u0412\u0421\u0401 \u2192 Run.\n--  \u0421\u043a\u0440\u0438\u043f\u0442 \u043c\u043e\u0436\u043d\u043e \u0437\u0430\u043f\u0443\u0441\u043a\u0430\u0442\u044c \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e \u2014 \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u0441\u043b\u043e\u043c\u0430\u0435\u0442\u0441\u044f.\n-- =====================================================================\n\n-- ---------- 0. \u0421\u0435\u043a\u0440\u0435\u0442\u043d\u044b\u0439 \u043a\u043e\u0434 \u043f\u0435\u0440\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0443\u0441\u043a\u0430 (\u0434\u043b\u044f \u0441\u043e\u0437\u0434\u0430\u043d\u0438\u044f \u0432\u043b\u0430\u0434\u0435\u043b\u044c\u0446\u0430) ----------\ncreate table if not exists public.app_config (\n  key   text primary key,\n  value text not null\n);\nalter table public.app_config enable row level security;      -- \u0431\u0435\u0437 \u043f\u043e\u043b\u0438\u0442\u0438\u043a = \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u043e \u0447\u0435\u0440\u0435\u0437 API\ninsert into public.app_config (key, value)\nvalues ('owner_setup_code', '__SETUP_CODE__')\non conflict (key) do nothing;\n-- \u0421\u043c\u0435\u043d\u0438\u0442\u044c \u043a\u043e\u0434 \u043f\u043e\u0437\u0436\u0435:  update public.app_config set value='\u041d\u041e\u0412\u042b\u0419-\u041a\u041e\u0414' where key='owner_setup_code';\n\n-- ---------- 1. \u0422\u0430\u0431\u043b\u0438\u0446\u044b ----------\ncreate table if not exists public.admins (\n  user_id      uuid primary key references auth.users (id) on delete cascade,\n  email        text        not null default '',\n  display_name text        not null check (char_length(display_name) between 1 and 40),\n  role         text        not null default 'admin' check (role in ('owner', 'admin')),\n  created_at   timestamptz not null default now()\n);\ncreate unique index if not exists one_owner on public.admins ((true)) where role = 'owner';\n\ncreate table if not exists public.invites (\n  code       text primary key,\n  created_by uuid        not null references auth.users (id) on delete cascade,\n  created_at timestamptz not null default now(),\n  expires_at timestamptz not null default (now() + interval '7 days'),\n  used_by    uuid references auth.users (id) on delete set null,\n  used_at    timestamptz\n);\n\ncreate table if not exists public.conversations (\n  id                   uuid primary key default gen_random_uuid(),\n  visitor_id           uuid        not null unique references auth.users (id) on delete cascade,\n  alias                text        not null default '\u0410\u043d\u043e\u043d\u0438\u043c',\n  status               text        not null default 'open' check (status in ('open', 'closed')),\n  unread_count         int         not null default 0,\n  last_message_at      timestamptz not null default now(),\n  last_message_preview text        not null default '',\n  created_at           timestamptz not null default now()\n);\ncreate index if not exists conversations_last_idx on public.conversations (last_message_at desc);\n\ncreate table if not exists public.messages (\n  id              bigint generated always as identity primary key,\n  conversation_id uuid        not null references public.conversations (id) on delete cascade,\n  sender          text        not null check (sender in ('visitor', 'admin')),\n  admin_id        uuid references auth.users (id) on delete set null,\n  admin_name      text,\n  body            text check (body is null or char_length(body) <= 4000),\n  image_path      text,\n  created_at      timestamptz not null default now(),\n  check (body is not null or image_path is not null)\n);\ncreate index if not exists messages_conv_idx on public.messages (conversation_id, id);\n\ncreate table if not exists public.reviews (\n  id               uuid primary key default gen_random_uuid(),\n  author_id        uuid references auth.users (id) on delete set null,\n  author_name      text        not null default '\u0410\u043d\u043e\u043d\u0438\u043c' check (char_length(author_name) between 1 and 40),\n  rating           int         not null check (rating between 1 and 5),\n  body             text        not null check (char_length(body) between 1 and 1500),\n  status           text        not null default 'pending' check (status in ('pending', 'published', 'hidden')),\n  reply            text check (reply is null or char_length(reply) <= 1500),\n  reply_admin_name text,\n  replied_at       timestamptz,\n  created_at       timestamptz not null default now()\n);\ncreate index if not exists reviews_status_idx on public.reviews (status, created_at desc);\n\n-- ---------- 2. \u0412\u0441\u043f\u043e\u043c\u043e\u0433\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u0444\u0443\u043d\u043a\u0446\u0438\u0438 ----------\ncreate or replace function public.is_admin() returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select exists (select 1 from public.admins where user_id = auth.uid()) $$;\n\ncreate or replace function public.is_owner() returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select exists (select 1 from public.admins where user_id = auth.uid() and role = 'owner') $$;\n\ncreate or replace function public.is_anon_user() returns boolean\nlanguage sql stable as\n$$ select coalesce((auth.jwt() ->> 'is_anonymous')::boolean, false) $$;\n\ncreate or replace function public.owns_conversation(cid uuid) returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select exists (select 1 from public.conversations c where c.id = cid and c.visitor_id = auth.uid()) $$;\n\n-- \u0434\u043b\u044f Storage: \u043f\u0435\u0440\u0432\u0430\u044f \u043f\u0430\u043f\u043a\u0430 \u0432 \u043f\u0443\u0442\u0438 \u0444\u0430\u0439\u043b\u0430 = id \u0434\u0438\u0430\u043b\u043e\u0433\u0430\ncreate or replace function public.can_access_conversation(cid text) returns boolean\nlanguage plpgsql stable security definer set search_path = public as\n$$\ndeclare u uuid;\nbegin\n  begin u := cid::uuid; exception when others then return false; end;\n  return public.is_admin()\n      or exists (select 1 from public.conversations c where c.id = u and c.visitor_id = auth.uid());\nend\n$$;\n\n-- ---------- 3. \u0422\u0440\u0438\u0433\u0433\u0435\u0440\u044b ----------\ncreate or replace function public.trg_conv_alias() returns trigger\nlanguage plpgsql as\n$$\nbegin\n  new.alias := '\u0410\u043d\u043e\u043d\u0438\u043c #' || upper(substr(replace(new.id::text, '-', ''), 1, 5));\n  return new;\nend\n$$;\ndrop trigger if exists conv_alias on public.conversations;\ncreate trigger conv_alias before insert on public.conversations\n  for each row execute function public.trg_conv_alias();\n\ncreate or replace function public.trg_msg_before() returns trigger\nlanguage plpgsql security definer set search_path = public as\n$$\ndeclare n int; nm text;\nbegin\n  if new.sender = 'admin' then\n    select display_name into nm from public.admins where user_id = auth.uid();\n    new.admin_id   := auth.uid();\n    new.admin_name := coalesce(nm, 'Admin');\n  else\n    new.admin_id   := null;\n    new.admin_name := null;\n    select count(*) into n from public.messages\n      where conversation_id = new.conversation_id and sender = 'visitor'\n        and created_at > now() - interval '1 minute';\n    if n >= 20 then raise exception 'rate_limited'; end if;      -- \u0437\u0430\u0449\u0438\u0442\u0430 \u043e\u0442 \u0441\u043f\u0430\u043c\u0430\n  end if;\n  return new;\nend\n$$;\ndrop trigger if exists msg_before on public.messages;\ncreate trigger msg_before before insert on public.messages\n  for each row execute function public.trg_msg_before();\n\ncreate or replace function public.trg_msg_after() returns trigger\nlanguage plpgsql security definer set search_path = public as\n$$\nbegin\n  update public.conversations set\n    last_message_at      = new.created_at,\n    last_message_preview = left(coalesce(nullif(new.body, ''), '\ud83d\udcf7 \u0424\u043e\u0442\u043e'), 80),\n    unread_count         = case when new.sender = 'visitor' then unread_count + 1 else 0 end,\n    status               = case when new.sender = 'visitor' then 'open' else status end\n  where id = new.conversation_id;\n  return new;\nend\n$$;\ndrop trigger if exists msg_after on public.messages;\ncreate trigger msg_after after insert on public.messages\n  for each row execute function public.trg_msg_after();\n\ncreate or replace function public.trg_review_before() returns trigger\nlanguage plpgsql security definer set search_path = public as\n$$\ndeclare nm text;\nbegin\n  if tg_op = 'INSERT' then\n    if not public.is_admin() then\n      new.author_id        := auth.uid();\n      new.status           := 'pending';            -- \u0441\u043d\u0430\u0447\u0430\u043b\u0430 \u043c\u043e\u0434\u0435\u0440\u0430\u0446\u0438\u044f\n      new.reply            := null;\n      new.reply_admin_name := null;\n      new.replied_at       := null;\n      if (select count(*) from public.reviews\n            where author_id = new.author_id and created_at > now() - interval '1 day') >= 3 then\n        raise exception 'rate_limited';\n      end if;\n    end if;\n  else  -- UPDATE (\u0442\u043e\u043b\u044c\u043a\u043e \u0430\u0434\u043c\u0438\u043d\u044b \u043f\u0440\u043e\u0439\u0434\u0443\u0442 \u043f\u043e\u043b\u0438\u0442\u0438\u043a\u0443)\n    if new.reply is distinct from old.reply then\n      if new.reply is null then\n        new.reply_admin_name := null; new.replied_at := null;\n      else\n        select display_name into nm from public.admins where user_id = auth.uid();\n        new.reply_admin_name := coalesce(nm, 'Admin');\n        new.replied_at       := now();\n      end if;\n    end if;\n  end if;\n  return new;\nend\n$$;\ndrop trigger if exists review_before on public.reviews;\ncreate trigger review_before before insert or update on public.reviews\n  for each row execute function public.trg_review_before();\n\n-- ---------- 4. \u0424\u0443\u043d\u043a\u0446\u0438\u0438 \u0434\u043b\u044f \u0430\u0434\u043c\u0438\u043d-\u043f\u0430\u043d\u0435\u043b\u0438 (RPC) ----------\ncreate or replace function public.claim_owner(p_code text, p_name text) returns void\nlanguage plpgsql security definer set search_path = public as\n$$\ndeclare v text;\nbegin\n  if auth.uid() is null or public.is_anon_user() then raise exception 'not_allowed'; end if;\n  if exists (select 1 from public.admins where role = 'owner') then raise exception 'owner_exists'; end if;\n  select value into v from public.app_config where key = 'owner_setup_code';\n  if v is null or v = '' or v like 'CHANGE-ME%' or p_code is distinct from v then raise exception 'bad_code'; end if;\n  insert into public.admins (user_id, email, display_name, role)\n  values (auth.uid(), coalesce(auth.jwt() ->> 'email', ''), left(trim(p_name), 40), 'owner');\nend\n$$;\n\ncreate or replace function public.create_invite() returns text\nlanguage plpgsql security definer set search_path = public as\n$$\ndeclare c text;\nbegin\n  if not public.is_owner() then raise exception 'forbidden'; end if;\n  c := upper(substr(replace(gen_random_uuid()::text, '-', ''), 1, 16));\n  insert into public.invites (code, created_by) values (c, auth.uid());\n  return c;\nend\n$$;\n\ncreate or replace function public.redeem_invite(p_code text, p_name text) returns void\nlanguage plpgsql security definer set search_path = public as\n$$\ndeclare inv public.invites;\nbegin\n  if auth.uid() is null or public.is_anon_user() then raise exception 'not_allowed'; end if;\n  if exists (select 1 from public.admins where user_id = auth.uid()) then raise exception 'already_admin'; end if;\n  select * into inv from public.invites\n    where code = upper(trim(p_code)) and used_by is null and expires_at > now() for update;\n  if not found then raise exception 'bad_code'; end if;\n  insert into public.admins (user_id, email, display_name, role)\n  values (auth.uid(), coalesce(auth.jwt() ->> 'email', ''), left(trim(p_name), 40), 'admin');\n  update public.invites set used_by = auth.uid(), used_at = now() where code = inv.code;\nend\n$$;\n\ncreate or replace function public.remove_admin(p_user uuid) returns void\nlanguage plpgsql security definer set search_path = public as\n$$\nbegin\n  if not public.is_owner() then raise exception 'forbidden'; end if;\n  delete from public.admins where user_id = p_user and role <> 'owner';\nend\n$$;\n\ncreate or replace function public.set_display_name(p_name text) returns void\nlanguage plpgsql security definer set search_path = public as\n$$\nbegin\n  if not public.is_admin() then raise exception 'forbidden'; end if;\n  update public.admins set display_name = left(trim(p_name), 40) where user_id = auth.uid();\nend\n$$;\n\n-- ---------- 5. \u041f\u0440\u0430\u0432\u0430 \u0434\u043e\u0441\u0442\u0443\u043f\u0430 ----------\ngrant usage on schema public to anon, authenticated;\ngrant execute on function public.is_admin(), public.is_owner(), public.is_anon_user(),\n  public.owns_conversation(uuid), public.can_access_conversation(text) to anon, authenticated;\n\nrevoke all on function public.claim_owner(text, text), public.create_invite(),\n  public.redeem_invite(text, text), public.remove_admin(uuid), public.set_display_name(text) from public, anon;\ngrant execute on function public.claim_owner(text, text), public.create_invite(),\n  public.redeem_invite(text, text), public.remove_admin(uuid), public.set_display_name(text) to authenticated;\n\ngrant select on public.reviews to anon;\ngrant select, insert, update, delete on public.conversations, public.messages, public.reviews to authenticated;\ngrant select on public.admins to authenticated;\ngrant select, delete on public.invites to authenticated;\n\n-- ---------- 6. Row Level Security (\u043a\u0442\u043e \u0447\u0442\u043e \u0432\u0438\u0434\u0438\u0442) ----------\nalter table public.admins        enable row level security;\nalter table public.invites       enable row level security;\nalter table public.conversations enable row level security;\nalter table public.messages      enable row level security;\nalter table public.reviews       enable row level security;\n\ndrop policy if exists admins_select on public.admins;\ncreate policy admins_select on public.admins for select to authenticated\n  using (public.is_admin());\n\ndrop policy if exists invites_select on public.invites;\ncreate policy invites_select on public.invites for select to authenticated using (public.is_owner());\ndrop policy if exists invites_delete on public.invites;\ncreate policy invites_delete on public.invites for delete to authenticated using (public.is_owner());\n\n-- \u0434\u0438\u0430\u043b\u043e\u0433\u0438: \u043f\u043e\u0441\u0435\u0442\u0438\u0442\u0435\u043b\u044c \u0432\u0438\u0434\u0438\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u0441\u0432\u043e\u0439, \u0430\u0434\u043c\u0438\u043d \u2014 \u0432\u0441\u0435\ndrop policy if exists conv_select on public.conversations;\ncreate policy conv_select on public.conversations for select to authenticated\n  using (visitor_id = auth.uid() or public.is_admin());\ndrop policy if exists conv_insert on public.conversations;\ncreate policy conv_insert on public.conversations for insert to authenticated\n  with check (visitor_id = auth.uid());\ndrop policy if exists conv_update on public.conversations;\ncreate policy conv_update on public.conversations for update to authenticated\n  using (public.is_admin()) with check (public.is_admin());\ndrop policy if exists conv_delete on public.conversations;\ncreate policy conv_delete on public.conversations for delete to authenticated using (public.is_owner());\n\n-- \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f\ndrop policy if exists msg_select on public.messages;\ncreate policy msg_select on public.messages for select to authenticated\n  using (public.is_admin() or public.owns_conversation(conversation_id));\ndrop policy if exists msg_insert_visitor on public.messages;\ncreate policy msg_insert_visitor on public.messages for insert to authenticated\n  with check (sender = 'visitor' and public.owns_conversation(conversation_id)\n              and (image_path is null or image_path like conversation_id::text || '/%'));\ndrop policy if exists msg_insert_admin on public.messages;\ncreate policy msg_insert_admin on public.messages for insert to authenticated\n  with check (sender = 'admin' and public.is_admin()\n              and (image_path is null or image_path like conversation_id::text || '/%'));\ndrop policy if exists msg_delete on public.messages;\ncreate policy msg_delete on public.messages for delete to authenticated using (public.is_owner());\n\n-- \u043e\u0442\u0437\u044b\u0432\u044b: \u0432\u0441\u0435 \u0432\u0438\u0434\u044f\u0442 \u043e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u043d\u043d\u044b\u0435; \u0430\u0432\u0442\u043e\u0440 \u0432\u0438\u0434\u0438\u0442 \u0441\u0432\u043e\u0438; \u0430\u0434\u043c\u0438\u043d \u2014 \u0432\u0441\u0451\ndrop policy if exists rev_select on public.reviews;\ncreate policy rev_select on public.reviews for select to anon, authenticated\n  using (status = 'published' or author_id = auth.uid() or public.is_admin());\ndrop policy if exists rev_insert_visitor on public.reviews;\ncreate policy rev_insert_visitor on public.reviews for insert to authenticated\n  with check (author_id = auth.uid() and status = 'pending');\ndrop policy if exists rev_insert_admin on public.reviews;\ncreate policy rev_insert_admin on public.reviews for insert to authenticated\n  with check (public.is_admin());\ndrop policy if exists rev_update on public.reviews;\ncreate policy rev_update on public.reviews for update to authenticated\n  using (public.is_admin()) with check (public.is_admin());\ndrop policy if exists rev_delete on public.reviews;\ncreate policy rev_delete on public.reviews for delete to authenticated using (public.is_owner());\n\n-- ---------- 7. \u0425\u0440\u0430\u043d\u0438\u043b\u0438\u0449\u0435 \u0444\u043e\u0442\u043e (\u043f\u0440\u0438\u0432\u0430\u0442\u043d\u043e\u0435) ----------\ninsert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)\nvalues ('chat-images', 'chat-images', false, 5242880, array['image/jpeg', 'image/png', 'image/webp', 'image/gif'])\non conflict (id) do update\n  set public = false, file_size_limit = excluded.file_size_limit, allowed_mime_types = excluded.allowed_mime_types;\n\ndrop policy if exists chat_img_select on storage.objects;\ncreate policy chat_img_select on storage.objects for select to authenticated\n  using (bucket_id = 'chat-images' and public.can_access_conversation((storage.foldername(name))[1]));\ndrop policy if exists chat_img_insert on storage.objects;\ncreate policy chat_img_insert on storage.objects for insert to authenticated\n  with check (bucket_id = 'chat-images' and public.can_access_conversation((storage.foldername(name))[1]));\ndrop policy if exists chat_img_delete on storage.objects;\ncreate policy chat_img_delete on storage.objects for delete to authenticated\n  using (bucket_id = 'chat-images' and public.is_owner());\n\n-- ---------- 8. Realtime (\u043c\u0433\u043d\u043e\u0432\u0435\u043d\u043d\u044b\u0435 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u0431\u0435\u0437 \u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u044f \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u044b) ----------\ndo $$\nbegin\n  begin alter publication supabase_realtime add table public.messages;      exception when duplicate_object then null; end;\n  begin alter publication supabase_realtime add table public.conversations; exception when duplicate_object then null; end;\n  begin alter publication supabase_realtime add table public.reviews;       exception when duplicate_object then null; end;\nend\n$$;\n";
function sqlModal(){
 const code=h('input',{class:'inp',placeholder:'Придумай секретный код владельца (длинный, случайный)',autocomplete:'off',spellcheck:'false'}),ta=h('textarea',{class:'inp',readonly:true,style:'min-height:280px;font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:10px'});
 const upd=()=>{ta.value=SQL_TEXT.replace('__SETUP_CODE__',code.value.trim().replace(/'/g,"''")||'CHANGE-ME-BEFORE-RUNNING')};code.oninput=upd;upd();
 modal('SQL для Supabase',h('p',{class:'mut',style:'margin:0 0 10px',text:'1) Придумай секретный код — он понадобится один раз, чтобы стать владельцем. 2) Скопируй SQL. 3) Supabase → SQL Editor → New query → вставь → Run.'}),code,ta,
  h('div',{class:'acts'},h('button',{class:'btn pri',onclick:async()=>{try{await navigator.clipboard.writeText(ta.value);toast('Скопировано')}catch(e){ta.removeAttribute('readonly');ta.select();toast('Выделено — нажми Ctrl+C')}}},'Копировать SQL')))}

<script>
(function(){
 const root=document.documentElement;

 function focusState(on){const a=app();if(a)a.classList.toggle('keyboard-open',!!on);setTimeout(syncViewport,on?80:180)}
 syncViewport();window.addEventListener('resize',syncViewport,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(syncViewport,250),{passive:true});
 if(window.visualViewport){window.visualViewport.addEventListener('resize',syncViewport,{passive:true});window.visualViewport.addEventListener('scroll',syncViewport,{passive:true})}
 document.addEventListener('focusin',e=>{if(e.target.matches('textarea,input,select'))focusState(true)});
 document.addEventListener('focusout',e=>{if(e.target.matches('textarea,input,select'))setTimeout(()=>{const a=document.activeElement;focusState(!!(a&&a.matches('textarea,input,select')))},80)});
 document.addEventListener('click',e=>{if(e.target.closest('.back'))focusState(false)},true);
})();
